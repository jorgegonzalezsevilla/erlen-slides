name: Publish release
on:
  push:
    tags: ['v*']
  release:
    types: [published]
permissions:
  contents: write
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run examples
      - run: git diff --exit-code -- examples/
      - run: python3 herramientas/package-release.py
      - name: Comprobar etiqueta, versión y notas
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "La etiqueta $TAG no corresponde a la versión $version de package.json." >&2
            exit 1
          fi
          if [ ! -f "docs/publicacion-$version.md" ]; then
            echo "Faltan las notas docs/publicacion-$version.md." >&2
            exit 1
          fi
      - name: Redactar las notas con la descarga y su suma
        run: |
          version=$(node -p "require('./package.json').version")
          zip="erlen-slides-$version-web.zip"
          cat "docs/publicacion-$version.md" > notas.md
          {
            printf '\n## Descarga\n\n'
            printf 'Descomprime `%s` y abre `erlen-slides-offline.html`. ' "$zip"
            printf 'El README explica cómo servir la carpeta localmente.\n\n'
            printf '```\n%s\n```\n' "$(cat "dist/$zip.sha256")"
          } >> notas.md
      - name: Publicar la versión y sus archivos
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          zip="dist/erlen-slides-$version-web.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notas.md
            gh release upload "$TAG" "$zip" "$zip.sha256" --clobber
          else
            gh release create "$TAG" "$zip" "$zip.sha256" \
              --title "Erlen Slides $version — Scientific presentations" \
              --notes-file notas.md
          fi
