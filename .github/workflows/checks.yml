name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run examples
      - run: git diff --exit-code -- examples/
      - run: python3 herramientas/package-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: erlen-slides-web
          path: dist/
